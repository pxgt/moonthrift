name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Record toolchain
        run: moon version --all

      - name: Update package registry
        run: moon update

      - name: Check formatting
        run: moon fmt --check

      - name: Generate and verify public interfaces
        run: |
          moon info --target all
          git diff --exit-code

      - name: Check every stable backend
        run: moon check --target all --deny-warn --warn-list +73-79

      - name: Build every stable backend
        run: moon build --target all

      - name: Test every stable backend
        run: moon test --target all --deny-warn --warn-list +73-79

      - name: Run in-memory RPC tutorial
        run: moon run examples/rpc_demo --target native --warn-list +73-79

      - name: Run native TCP RPC tutorial
        run: moon run examples/tcp_demo --target native --warn-list +73-79

      - name: Run CLI examples
        run: |
          moon run cmd/main --target native
          moon run cmd/main --target native -- check examples/tutorial.thrift
          moon run cmd/main --target native -- check examples/multifile/api.thrift
          moon run cmd/main --target native -- inspect examples/tutorial.thrift
          moon run cmd/main --target native -- inspect examples/multifile/api.thrift
          moon run cmd/main --target native -- diff examples/tutorial.thrift examples/tutorial-v2.thrift || test "$?" -eq 3

      - name: Test compatibility CLI and Git baseline
        run: python tools/test_compat_cli.py

      - name: Reject breaking schema changes against PR base
        if: github.event_name == 'pull_request'
        run: >-
          python tools/compat_git.py
          --base-ref "${{ github.event.pull_request.base.sha }}"
          --schema-dir examples
          --policy backward
          --format github

      - name: Verify generated MoonBit source
        run: |
          moon run cmd/main --target native -- generate examples/tutorial.thrift /tmp/tutorial.generated.mbtx
          moon run cmd/main --target native -- generate examples/multifile/api.thrift /tmp/multifile.generated.mbtx
          moon run cmd/main --target native -- generate examples/oneway.thrift /tmp/oneway.generated.mbtx
          moon fmt /tmp/tutorial.generated.mbtx /tmp/multifile.generated.mbtx /tmp/oneway.generated.mbtx
          cmp examples/generated/model.mbt /tmp/tutorial.generated.mbtx
          cmp examples/generated_workspace/model.mbt /tmp/multifile.generated.mbtx
          cmp examples/generated_oneway/model.mbt /tmp/oneway.generated.mbtx

      - name: Verify package artifact
        run: moon package --frozen

      - name: Reject generated or formatting drift
        run: git diff --exit-code

  interoperability-python:
    name: Apache Thrift Python interoperability
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: interop/python/requirements.txt

      - name: Install pinned reference runtime
        run: python -m pip install -r interop/python/requirements.txt

      - name: Rebuild and verify Python wire fixtures
        run: python interop/python/reference.py --check

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Record toolchain
        run: moon version --all

      - name: Update package registry
        run: moon update

      - name: Run bidirectional interoperability tests
        run: moon test interop/fixtures --target all --deny-warn --warn-list +73-79
